        *{font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; box-sizing:border-box;}
        .arabic{font-family: system-ui, serif;}
        @keyframes kenburns {0%{transform:scale(1) translate(0,0);} 100%{transform:scale(1.15) translate(-10px,-10px);}}
        .kenburns{animation: kenburns 12s ease-in-out infinite alternate;}
        @keyframes kenBurns {0% {transform: scale(1) translate(0,0);} 50% {transform: scale(1.1) translate(-2%, -1%);} 100% {transform: scale(1) translate(0,0);}}
        .kenBurns-anim{animation: kenBurns 20s ease-in-out infinite; object-fit:cover; width:100%; height:100%;}
        @keyframes slidePan {0%{transform: translateX(-20%) scale(1.1);} 100%{transform: translateX(20%) scale(1.15);}}
        @keyframes fadeZoom {0%{opacity:0.5; transform: scale(0.9);} 50%{opacity:1; transform: scale(1.05);} 100%{opacity:1; transform: scale(1);}}
        @keyframes parallaxUp {0%{transform: translateY(20px) scale(1.05);} 100%{transform: translateY(-20px) scale(1.1);}}
        @keyframes rotate3d {0%{transform: rotate(0deg) scale(1);} 100%{transform: rotate(1deg) scale(1.05);}}
        @keyframes blurSharp {0%{filter: blur(8px); transform: scale(1.1);} 100%{filter: blur(0px); transform: scale(1);}}
        @keyframes slideIn {from {opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);}}
        .card-animate{animation: slideIn 0.4s ease-out both;}
        .stat-lift{transition: transform 0.2s ease, box-shadow 0.2s ease;}
        .stat-lift:hover{transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15), 0 4px 8px -4px rgba(0,0,0,0.1);}
        @keyframes marquee {0%{transform:translateX(100%);}100%{transform:translateX(-100%);}}
        .marquee{animation: marquee 12s linear infinite;}
        @keyframes pulseGreen {0%{background:#dcfce7;} 50%{background:#bbf7d0;} 100%{background:#dcfce7;}}
        .ayah-pulse{animation: pulseGreen 1.5s ease-in-out infinite;}
        @keyframes subTabSlide {from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
        .subtab-animate{animation: subTabSlide 0.35s ease-out;}
        @keyframes shimmer {0%{transform:translateX(-100%);} 100%{transform:translateX(100%);}}
        .shimmer{position:relative; overflow:hidden; background:#f1f5f9;}
        .shimmer::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmer 1.4s infinite;}
        .btn-hover{transition: transform 0.18s ease, box-shadow 0.18s ease;}
        .btn-hover:hover{transform: scale(1.02);}
        .btn-hover:active{transform: scale(0.98);}
        .tab-active{transform: scale(1.05); transition: transform 0.18s ease;}
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
        /* TRUE MOBILE APP FEEL */
        @media (max-width: 768px){
          html{font-size:14px;}
          .mobile-compact .p-6{padding:0.75rem !important;}
          .mobile-compact .p-5{padding:0.75rem !important;}
          .mobile-compact .p-4{padding:0.625rem !important;}
          .mobile-compact button{font-size:0.75rem !important; padding:0.375rem 0.75rem !important; border-radius:9999px !important;}
          .mobile-compact input, .mobile-compact select, .mobile-compact textarea{height:2.25rem !important; font-size:0.875rem !important; padding:0.5rem 0.75rem !important;}
          .mobile-compact .text-2xl{font-size:1.25rem !important;}
          .mobile-compact .text-xl{font-size:1.125rem !important;}
          .mobile-compact .rounded-2xl{border-radius:1rem !important;}
          .mobile-compact .rounded-[24px]{border-radius:1rem !important;}
          .mobile-compact .grid{gap:0.5rem !important;}
          .mobile-compact .h-[360px]{height:180px !important;}
          .mobile-compact .h-[320px]{height:180px !important;}
          .tab-scroll{overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch;}
          .tab-scroll::-webkit-scrollbar{display:none;}
          .header-compact{height:48px !important; min-height:48px !important; padding-top:6px !important; padding-bottom:6px !important;}
          .header-compact img{width:28px !important; height:28px !important;}
          .content-pb{padding-bottom:80px !important;}
          .mobile-bottom-sheet{position:fixed !important; bottom:0 !important; left:0 !important; right:0 !important; max-height:90vh !important; border-radius:24px 24px 0 0 !important; overflow-y:auto !important; animation: slideIn 0.3s ease-out;}
          .banner-mobile{height:180px !important;}
          .banner-desktop{height:180px !important;}
          .grid-mobile-1{grid-template-columns:1fr !important;}
          .stats-mobile{padding:0.5rem !important; font-size:0.75rem !important;}
          .stats-mobile .text-2xl{font-size:1rem !important;}
        }
        @media (max-width: 390px){
          html{font-size:13px;}
        }
        .text-10px{font-size:10px; line-height:1.2;}
        .banner-container{position:relative; overflow:hidden; border-radius:0.75rem; height:180px;}
        @media (min-width: 769px){ .banner-container{height:320px; border-radius:0.75rem;} }
