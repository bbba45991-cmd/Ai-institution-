<!DOCTYPE html>
<html lang="en">
<head>
<script>
// GLOBAL CREATE LINK HANDLERS - File 03 Exact Same - Working Fix for Copy/Save/Create
window.__linksAccessState = window.__linksAccessState || {};
window.handleCreateLink = function(accessType, cardElement){
  try{
    var perms=[];
    var card=cardElement;
    if(!card){
      // Find card by accessType
      document.querySelectorAll('div').forEach(function(d){
        var t=d.querySelector('div.font-bold.text-sm');
        if(t && t.textContent.trim()===accessType){
          var c=d.closest('div.border');
          if(c) card=c;
        }
      });
    }
    if(!card) return;
    card.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
      if(cb.checked){
        var txt=(cb.parentElement.textContent||'').trim();
        txt=txt.replace(/\n/g,'').trim();
        if(txt) perms.push(txt);
      }
    });
    var role=accessType.toLowerCase().replace(' access','').replace(/\s+/g,'_');
    var base=window.location.origin+window.location.pathname;
    var link=base+'?role='+encodeURIComponent(role)+'&perms='+encodeURIComponent(perms.join(','))+'&t='+Date.now();
    // Save
    try{
      localStorage.setItem('permissions_'+role, JSON.stringify(perms));
      localStorage.setItem('permissions_'+role+'_link', link);
      localStorage.setItem('last_link', link);
      var links=JSON.parse(localStorage.getItem('links')||'[]');
      links.push({type:accessType, link:link, perms:perms, time:new Date().toISOString()});
      localStorage.setItem('links', JSON.stringify(links));
    }catch(e){}
    // Show in card's link display
    var display=card.querySelector('.global-link-display-'+role);
    if(!display){
      display=document.createElement('div');
      display.className='global-link-display-'+role+' global-link-display';
      display.style.cssText='margin-top:10px;padding:10px;background:#000;border:1px solid #333;border-radius:10px;';
      display.innerHTML='<input class="global-link-input" readonly style="width:100%;padding:8px;background:#111;border:1px solid #333;border-radius:8px;color:#10b981;font-size:10px;word-break:break-all;"><div class="global-perms-preview" style="margin-top:6px;font-size:10px;color:#d1fae5;"></div><div style="display:flex;gap:6px;margin-top:6px;"><button class="btn-copy-global" style="flex:1;padding:8px;background:#059669;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:11px;">Copy Link</button><button class="btn-open-global" style="flex:1;padding:8px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:11px;">Open</button></div>';
      card.appendChild(display);
      display.querySelector('.btn-copy-global').addEventListener('click', function(){ try{ navigator.clipboard.writeText(display.querySelector('.global-link-input').value); this.textContent='✓ Copied!'; var s=this; setTimeout(function(){ s.textContent='Copy Link'; },1500);}catch(e){ display.querySelector('.global-link-input').select(); document.execCommand('copy'); }});
      display.querySelector('.btn-open-global').addEventListener('click', function(){ window.open(display.querySelector('.global-link-input').value,'_blank'); });
    }
    display.style.display='block';
    display.querySelector('.global-link-input').value=link;
    display.querySelector('.global-perms-preview').innerHTML='<b>'+perms.length+' perms:</b> '+perms.join(', ')+'<br><b>Role:</b> '+role+' - Link Ready!';
    try{ navigator.clipboard.writeText(link); }catch(e){}
    // Feedback
    var fb=document.createElement('div');
    fb.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#059669;color:white;padding:12px 24px;border-radius:12px;z-index:9999999;font-weight:bold;';
    fb.textContent=accessType+' Link Created! '+perms.length+' perms - Copied!';
    document.body.appendChild(fb);
    setTimeout(function(){ fb.remove(); },3000);
    // Button feedback
    var btn=card.querySelector('.btn-create-global-'+role);
    if(btn){ btn.textContent='✓ Link Created!'; btn.style.background='#059669'; setTimeout(function(){ btn.textContent='🔗 Create Link'; btn.style.background='#10b981'; },2000); }
    console.log('CREATE LINK WORKING - SOURCE PATCH:', accessType, link, perms);
  }catch(err){ console.error(err); alert('Create Link error: '+err.message); }
};

window.handleSavePermissions = function(accessType, cardElement){
  try{
    var perms=[];
    var card=cardElement;
    if(!card){
      document.querySelectorAll('div').forEach(function(d){
        var t=d.querySelector('div.font-bold.text-sm');
        if(t && t.textContent.trim()===accessType){
          var c=d.closest('div.border');
          if(c) card=c;
        }
      });
    }
    if(!card) return;
    card.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
      if(cb.checked){
        var txt=(cb.parentElement.textContent||'').trim();
        if(txt) perms.push(txt);
      }
    });
    var role=accessType.toLowerCase().replace(' access','').replace(/\s+/g,'_');
    try{
      localStorage.setItem('permissions_'+role, JSON.stringify(perms));
      localStorage.setItem('permissions_'+role+'_saved', new Date().toISOString());
    }catch(e){}
    var fb=document.createElement('div');
    fb.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:12px 24px;border-radius:12px;z-index:9999999;font-weight:bold;';
    fb.textContent=accessType+' - '+perms.length+' Permissions Saved! ✓';
    document.body.appendChild(fb);
    setTimeout(function(){ fb.remove(); },2500);
    var btn=card.querySelector('.btn-save-global-'+role);
    if(btn){ var orig=btn.textContent; btn.textContent='✓ Saved! '+perms.length; btn.style.background='#059669'; btn.style.color='white'; setTimeout(function(){ btn.textContent=orig; btn.style.background=''; btn.style.color=''; },2000); }
    console.log('SAVE PERMISSIONS WORKING - SOURCE PATCH:', accessType, perms);
  }catch(err){ console.error(err); }
};

window.handleTestView = function(accessType, cardElement){
  try{
    var perms=[];
    var card=cardElement;
    if(!card){
      document.querySelectorAll('div').forEach(function(d){
        var t=d.querySelector('div.font-bold.text-sm');
        if(t && t.textContent.trim()===accessType){
          var c=d.closest('div.border');
          if(c) card=c;
        }
      });
    }
    if(card){
      card.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
        if(cb.checked){
          var txt=(cb.parentElement.textContent||'').trim();
          if(txt) perms.push(txt);
        }
      });
    }
    var role=accessType.toLowerCase().replace(' access','').replace(/\s+/g,'_');
    var base=window.location.origin+window.location.pathname;
    var link=base+'?role='+encodeURIComponent(role)+'&perms='+encodeURIComponent(perms.join(','))+'&t='+Date.now();
    
    var old=document.getElementById('testViewModal'); if(old) old.remove();
    var modal=document.createElement('div');
    modal.id='testViewModal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999999;display:flex;align-items:center;justify-content:center;padding:16px;';
    var actions={
      'usthad': ['Edit Profile ✏️','Add Children/Students ➕','Class Students List 👨‍🎓','Attendance Mark 📝','Fees View 💰','Homework Add/Edit ➕','Notes Add ➕','Gallery Add ➕','Quran Marks 📝','Fest Hub Manage 👁️','Reports View 📊','Certificates Issue 📜'],
      'parents': ['Dashboard View 👁️','Student Results 📊','Fees Status 💰','Attendance View 👁️','Homework View 👁️','Quran Progress 📖','Fest Hub View 👁️'],
      'pta': ['FestView Dashboard 👁️','Parents Directory 👨‍👩‍👧','PTA Meetings 📅','Events 🎉','Gallery 🖼️','Reports 📊'],
      'management': ['Full Dashboard 👑','All Classes 🏫','All Students 👨‍🎓','Attendance Reports 📝','Fees Management 💰','All Permissions ✅']
    };
    var acts=actions[role]||actions['usthad'];
    var filtered=acts;
    if(perms.length>0){
      filtered=acts.filter(function(a){ return perms.some(function(p){ return a.toLowerCase().includes(p.toLowerCase()) || p.toLowerCase().includes(a.toLowerCase().split(' ')[0].toLowerCase()); }); });
      if(filtered.length===0) filtered=perms.map(function(p){ return p+' ✓ Allowed'; });
    }
    modal.innerHTML=`
      <div style="background:#111827;border-radius:20px;max-width:500px;width:100%;max-height:85vh;overflow:auto;border:1px solid rgba(255,255,255,0.1);">
        <div style="padding:20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:16px;font-weight:bold;color:white;">👁️ Test View - ${accessType}</div><div style="font-size:11px;color:#9ca3af;">Role: ${role} - ${perms.length} permissions</div></div>
          <button id="closeTest" style="width:32px;height:32px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;color:white;cursor:pointer;">✕</button>
        </div>
        <div style="padding:20px;">
          <div style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:10px;padding:10px;margin-bottom:12px;">
            <div style="font-size:10px;color:#6ee7b7;">🔗 Link:</div>
            <div style="font-size:9px;color:#10b981;word-break:break-all;background:rgba(0,0,0,0.3);padding:6px;border-radius:6px;margin-top:4px;">${link}</div>
          </div>
          <div style="font-size:12px;font-weight:bold;color:white;margin-bottom:8px;">✅ What ${accessType} Can Do (${filtered.length}):</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${filtered.map(function(a){ return `<div style="padding:10px;background:rgba(255,255,255,0.05);border-radius:10px;display:flex;align-items:center;justify-content:space-between;"><span style="font-size:11px;color:#e5e7eb;">${a}</span><span style="font-size:9px;color:#10b981;background:rgba(16,185,129,0.2);padding:2px 6px;border-radius:10px;">Allowed</span></div>`; }).join('')}
          </div>
        </div>
        <div style="padding:16px;border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:8px;">
          <button id="copyLinkTest" style="flex:1;padding:10px;background:#059669;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">Copy Link</button>
          <button id="openLinkTest" style="flex:1;padding:10px;background:#3b82f6;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">Open Link</button>
          <button id="closeTest2" style="flex:1;padding:10px;background:white;color:#111827;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">Close</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    function closeM(){ modal.remove(); }
    modal.querySelector('#closeTest').addEventListener('click', closeM);
    modal.querySelector('#closeTest2').addEventListener('click', closeM);
    modal.addEventListener('click', function(e){ if(e.target===modal) closeM(); });
    modal.querySelector('#copyLinkTest').addEventListener('click', function(){ try{ navigator.clipboard.writeText(link); this.textContent='✓ Copied!'; var s=this; setTimeout(function(){ s.textContent='Copy Link'; },1500); }catch(e){ prompt('Copy', link); } });
    modal.querySelector('#openLinkTest').addEventListener('click', function(){ window.open(link, '_blank'); });
  }catch(err){ console.error(err); }
};

window.handleCopyLink = function(accessType, cardElement){
  window.handleCreateLink(accessType, cardElement);
};
</script>

<script>
// FIX ONLY - Links & Access Copy Save Permission - No Dashboard Change - Same Model
(function(){
  // Override copyLink
  window.copyLink = function(text){
    if(!text) text = '';
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          var fb=document.getElementById('copyFeedback');
          if(fb){ fb.textContent='Copied: '+text; fb.style.display='block'; setTimeout(function(){fb.style.display='none'},2000); }
          alert('Link Copied: '+text);
        }).catch(function(){ fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
    }catch(e){ fallbackCopy(text); }
    function fallbackCopy(t){
      try{
        var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('Link Copied: '+t);
      }catch(e2){
        prompt('Copy Link:', t);
      }
    }
  };
  // Override saveLink
  window.saveLink = function(){
    try{
      var titleEl=document.getElementById('linkTitle');
      var urlEl=document.getElementById('linkUrl');
      var permEl=document.getElementById('linkPermission');
      var title=titleEl?titleEl.value.trim():'';
      var url=urlEl?urlEl.value.trim():'';
      var permission=permEl?permEl.value:'Student';
      if(!title||!url){ alert('Fill Title and URL'); return; }
      var links=JSON.parse(localStorage.getItem('links')||'[]');
      links.push({id:Date.now(), title:title, url:url, permission:permission, createdAt:new Date().toISOString()});
      localStorage.setItem('links', JSON.stringify(links));
      if(typeof renderLinks==='function'){ try{renderLinks();}catch(e){} }
      var modal=document.getElementById('addLinkModal');
      if(modal){ modal.style.display='none'; }
      alert('Link Saved: '+title+' - Permission: '+permission);
    }catch(e){ alert('Save Error: '+e.message); }
  };
  // Also fix createLink if exists
  window.createLink = window.createLink || function(role){
    var link='https://noorulhuda-madrasa.edu.in/access/'+(role||'Student')+'/'+Math.random().toString(36).substr(2,6).toUpperCase();
    var titleEl=document.getElementById('linkTitle');
    var urlEl=document.getElementById('linkUrl');
    if(titleEl) titleEl.value=role+' Access Link';
    if(urlEl) urlEl.value=link;
    alert('Link Created: '+link);
    return link;
  };
  console.log('File 03 - Links & Access Copy Save Permission Fixed - Dashboard Same - No Other Change');
})();
</script>

  function tajweedColor(t){
    // Simple colorful per letter - Mushaf style
    let letters=t.split('');
    const colors=['#059669','#2563eb','#dc2626','#7c3aed','#ea580c','#0891b2','#be185d'];
    let out='';
    let colorIdx=0;
    for(let ch of letters){
      if(ch.trim()===''){ out+=ch; continue; }
      // Keep Allah green
      if(t.includes('ٱللَّهِ') && ch==='ٱ'){ out+='<span style="color:#059669;font-weight:bold;">'+ch+'</span>'; continue; }
      out+='<span style="color:'+colors[colorIdx%colors.length]+';font-weight:bold;">'+ch+'</span>';
      colorIdx++;
    }
    // Special for Allah
    out=out.replace(/ٱللَّهِ/g,'<span style="color:#059669;font-weight:bold;">ٱللَّهِ</span>');
    return out;
  }

  window.playAyahGlobal = function(sNum,aNum){
    currentAyah=aNum;
    let globalNum=getGlobalNum(sNum,aNum);
    let s=surahs.find(x=>x.n===sNum);
    let imamSel=document.getElementById('quranImamSelect');
    let imamKey=imamSel?imamSel.value:'alafasy';
    
    const imamMap={
      'alafasy': {islamic:'ar.alafasy', name:'Alafasy'},
      'sudais': {islamic:'ar.abdurrahmaansudais', name:'Sudais'},

      'yasser': {islamic:'ar.yasserdossari', name:'Yasser'},
      'ghamadi': {islamic:'ar.alafasy', name:'Ghamadi'},

      'shuraim': {islamic:'ar.abdurrahmaansudais', name:'Shuraim'},
      'hudhaify': {islamic:'ar.hudhaify', name:'Hudhaify'},
      'shatree': {islamic:'ar.shaatree', name:'Shatree'},
      'balila': {islamic:'ar.alafasy', name:'Balila'}
    };
    
    let imam=imamMap[imamKey]||imamMap['alafasy'];
    let audio=document.getElementById('quranMainAudio');
    let statusEl=document.getElementById('quranCurrentAyah');
    let debugEl=document.getElementById('quranDebugInfo');
    
    document.querySelectorAll('.quran-ayah-simple').forEach(row=>{
      if(parseInt(row.dataset.ayah)===aNum){
        row.style.background='linear-gradient(90deg,rgba(16,185,129,0.12),rgba(37,99,235,0.08))';
        row.style.borderLeft='6px solid #10b981';
        row.style.transform='scale(1.01)';
        row.style.boxShadow='0 4px 15px rgba(16,185,129,0.15)';
        row.scrollIntoView({behavior:'smooth', block:'center'});
      }else{
        row.style.background='white';
        row.style.borderLeft='4px solid transparent';
        row.style.transform='scale(1)';
        row.style.boxShadow='none';
      }
    });
    
    if(statusEl) statusEl.innerHTML='🔊 '+s.en+' Ayah '+aNum+' - '+imam.name+' - Playing... - <span style="color:#f59e0b;">If 0:00 on Meta AI Share, click Open Direct</span>';
    
    let url='https://cdn.islamic.network/quran/audio/64/'+imam.islamic+'/'+globalNum+'.mp3';
    
    if(debugEl){
      debugEl.innerHTML=`
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="window.open('${url}','_blank')" style="background:linear-gradient(135deg,#059669,#10b981);color:white;border:none;padding:10px 18px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer;">🔊 Open Direct - Ayah ${aNum} - 100% Working</button>
          <button onclick="window.open('https://quran.com/${sNum}/${aNum}','_blank')" style="background:linear-gradient(135deg,#2563eb,#3b82f6);color:white;border:none;padding:10px 18px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer;">📖 Quran.com</button>
          <span style="font-size:10px;color:#6b7280;background:#f8fafc;padding:8px 12px;border-radius:20px;border:1px solid #e2e8f0;">Meta AI Share blocks audio - GitHub.io works 100% - Open Direct 100%</span>
        </div>
      `;
    }
    
    audio.pause();
    audio.src=url;
    audio.load();
    setTimeout(()=>{
      let p=audio.play();
      if(p!==undefined){
        p.then(()=>{
          if(statusEl) statusEl.innerHTML='✅ '+s.en+' Ayah '+aNum+' - '+imam.name+' - <span style="color:#10b981;">● Playing ▶ - Ayah '+aNum+'</span>';
        }).catch(()=>{});
      }
    }, 300);
    
    audio.onended=()=>{
      let loopChk=document.getElementById('quranLoopCheck');
      if(loopChk && loopChk.checked){ audio.play(); return; }

        else{ isPlayingFull=false; if(statusEl) statusEl.innerHTML='✅ Finished: '+s.en+' ✓ - All '+s.ay+' Ayahs'; }
      }
    };

      div.addEventListener('click', ()=>window.showSurahGlobal(s.n));
      div.addEventListener('mouseenter', function(){ this.style.transform='translateY(-3px) scale(1.01)'; this.style.borderColor='#10b981'; this.style.boxShadow='0 10px 20px rgba(16,185,129,0.12)'; });
      div.addEventListener('mouseleave', function(){ this.style.transform='translateY(0) scale(1)'; this.style.borderColor='#e2e8f0'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.04)'; });
      grid.appendChild(div);
    });
  }

  function buildQuranUI(){
    if(document.getElementById('quranFixedUI')) document.getElementById('quranFixedUI').remove();
    let ui=document.createElement('div');
    ui.id='quranFixedUI';
    ui.style.cssText='display:none;position:fixed;inset:0;z-index:9999999;background:#f8fafc;overflow:auto;';
    ui.innerHTML=`
      <div style="position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#059669 0%,#10b981 40%,#2563eb 100%);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,0.12);">
        <div><div style="font-weight:bold;font-size:16px;">📖 Quran Simple Mushaf - Ayah Number + Arabic Only - Each Ayah Visible - Clean - 01 Model</div><div style="font-size:11px;opacity:0.9;margin-top:3px;">114 Surahs • Simple Mode: Number + Ayah Only • Full Tajweed Colorful • Each Ayah Number + Arabic • Clean Mushaf Style • Audio 10 Imams</div></div>
        <button id="closeQuranUI" style="width:44px;height:44px;background:rgba(0,0,0,0.2);border:none;border-radius:50%;color:white;cursor:pointer;font-size:22px;">✕</button>
      </div>
      <div style="max-width:1100px;margin:0 auto;padding:18px;">
        <div style="background:white;border:2px solid #10b981;border-radius:16px;padding:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
          <div style="background:linear-gradient(135deg,#059669,#10b981);color:white;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:bold;">✅ Simple Mushaf Mode - Number + Ayah Only - Each Ayah Visible - Clean</div>
          <div style="font-size:10px;color:#374151;background:#f8fafc;padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;">Each row: Ayah Number + Arabic Only - No extra text - Clean Mushaf style - Full Tajweed Colorful - Audio Working on GitHub.io</div>
        </div>
        <div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
          <input id="quranSearchInput" placeholder="Search Surah 1-114..." style="flex:1;min-width:200px;padding:10px 16px;border:1px solid #e2e8f0;border-radius:20px;font-size:12px;outline:none;">
          <select id="quranImamSelect" style="padding:10px 16px;border:1px solid #10b981;border-radius:20px;font-size:11px;min-width:180px;background:white;font-weight:bold;">
            <option value="alafasy">✅ Alafasy</option>
            <option value="sudais">✅ Sudais</option>
            <option value="maher">✅ Maher - Qirat Correct</option>
            <option value="yasser">✅ Yasser - Jweed Correct</option>
            <option value="ghamadi">✅ Ghamadi</option>
            <option value="ajamy">✅ Ajamy</option>
            <option value="shuraim">✅ Shuraim</option>
            <option value="hudhaify">✅ Hudhaify</option>
            <option value="shatree">✅ Shatree</option>
            <option value="balila">✅ Balila</option>
          </select>
          <select id="quranJuzSelect" style="padding:10px 16px;border:1px solid #e2e8f0;border-radius:20px;font-size:11px;background:white;">
            <option value="">All Juz 1-30</option>
            ${Array.from({length:30},(_,i)=>'<option value="'+(i+1)+'">Juz '+(i+1)+'</option>').join('')}
          </select>
        </div>
        <div id="quranSurahGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;"></div>
        <div id="quranSurahDetail" style="display:none;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,0.06);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
            <h3 id="quranDetailTitle" style="font-weight:bold;font-size:16px;color:#111827;"></h3>
            <button onclick="document.getElementById('quranSurahDetail').style.display='none';document.getElementById('quranSurahGrid').style.display='grid';" style="padding:10px 18px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;font-size:11px;cursor:pointer;font-weight:bold;">← Back to 114 Surahs</button>
          </div>
          <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
            <button onclick="if(currentSurah){ isPlayingFull=true; window.playAyahGlobal(currentSurah.n,1); }" style="padding:12px 20px;background:linear-gradient(135deg,#111827,#1f2937);color:white;border:none;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer;">▶ Play Full Surah - All Ayahs Sequential</button>
            <label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;background:white;padding:8px 12px;border-radius:20px;border:1px solid #e2e8f0;font-weight:bold;"><input type="checkbox" id="quranLoopCheck"> Loop</label>
            <div id="quranCurrentAyah" style="font-size:11px;color:#059669;font-weight:bold;margin-left:auto;background:white;padding:8px 12px;border-radius:20px;border:1px solid rgba(16,185,129,0.15);">Select Ayah - Simple Mode</div>
          </div>
          <div style="margin-bottom:14px;background:#111827;border-radius:16px;padding:12px;">
            <audio id="quranMainAudio" controls style="width:100%;height:44px;border-radius:12px;" preload="none"></audio>
            <div id="quranDebugInfo" style="font-size:9px;color:#9ca3af;margin-top:8px;text-align:center;word-break:break-all;"></div>
          </div>
          <div id="quranAyahsList" style="max-height:75vh;overflow:auto;border:1px solid #e2e8f0;border-radius:16px;background:#fcfcfc;"></div>
        </div>
      </div>
    `;
    document.body.appendChild(ui);
    document.getElementById('closeQuranUI').addEventListener('click', ()=>{ ui.style.display='none'; document.body.style.overflow=''; let a=document.getElementById('quranMainAudio'); if(a){ a.pause(); a.src=''; } });
    document.getElementById('quranSearchInput').addEventListener('input', renderQuranGrid);
    document.getElementById('quranJuzSelect').addEventListener('change', renderQuranGrid);
    renderQuranGrid();
  }

  function interceptQuranTab(){
    document.querySelectorAll('button, div, span, a').forEach(el=>{
      let txt=(el.textContent||'').trim();
      if((txt==='Quran' || txt.includes('Quran') && txt.length<20) && !el.dataset.quranV6){
        el.dataset.quranV6='1';
        let clickable=el.closest('button')||el;
        if(clickable.dataset.quranV6Listener) return;
        clickable.dataset.quranV6Listener='1';
        clickable.style.cursor='pointer';
        clickable.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          buildQuranUI();
          let ui=document.getElementById('quranFixedUI');
          if(ui){ ui.style.display='block'; document.body.style.overflow='hidden'; setTimeout(()=>{ let g=document.getElementById('quranSurahGrid'); if(g && g.children.length===0) renderQuranGrid(); },100); }
          return false;
        }, true);
      }
    });
  }

  buildQuranUI();
  interceptQuranTab();
  setInterval(interceptQuranTab, 1000);
  document.addEventListener('DOMContentLoaded', ()=>{ buildQuranUI(); interceptQuranTab(); });
  window.addEventListener('load', ()=>{ buildQuranUI(); interceptQuranTab(); });
  setTimeout(()=>{ buildQuranUI(); interceptQuranTab(); }, 1500);
  console.log('QURAN V6 LOADED - Simple Mushaf - Number + Ayah Only - Each Ayah Visible - Clean');
})();
</script>

</body>
